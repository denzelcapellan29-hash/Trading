name: Equity Corridor ACCEPT 78m Pilot
on:
  workflow_dispatch:
  push:
    branches: [production/three-portfolio-integration]
    paths:
      - '.github/workflows/equity-corridor-78m-pilot.yml'
      - 'code/production/tools/equity_tv_corridor_pilot.py'
      - 'code/production/src/trading_prod/equity/corridor_accept.py'
      - 'code/production/tests/test_corridor_accept.py'
permissions:
  contents: read
jobs:
  corridor-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install production and TradingView client
        working-directory: code/production
        run: |
          python -m pip install --disable-pip-version-check -e '.[equity]'
          python -m pip install --disable-pip-version-check tradingview-api-python
      - name: Run Corridor unit tests
        working-directory: code/production
        run: python -m unittest tests.test_corridor_accept -v
      - name: Read only 40-name 78m current-source pilot
        working-directory: code/production
        env:
          SESSIONID: ${{ secrets.SESSIONID }}
          SESSIONID_SIGN: ${{ secrets.SESSIONID_SIGN }}
        run: python tools/equity_tv_corridor_pilot.py --limit 40 --depth 340
