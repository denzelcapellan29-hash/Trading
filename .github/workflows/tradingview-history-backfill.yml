name: TradingView Intraday History Backfill
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tradingview-history-backfill.yml'
permissions:
  contents: read
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install tradingview-api-python
      - name: Backfill test
        env:
          SESSIONID: ${{ secrets.SESSIONID }}
          SESSIONID_SIGN: ${{ secrets.SESSIONID_SIGN }}
        run: python code/tradingview_data/history_backfill_probe.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradingview-history-backfill
          path: artifacts/tradingview_backfill/
          retention-days: 7
