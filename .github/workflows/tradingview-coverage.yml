name: TradingView Coverage Tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tradingview-coverage.yml'
      - 'code/tradingview_data/*_coverage_test.py'
      - 'code/tradingview_data/history_depth_test.py'
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check tradingview-api-python pandas
      - name: Frozen FX 31
        env:
          SESSIONID: ${{ secrets.SESSIONID }}
          SESSIONID_SIGN: ${{ secrets.SESSIONID_SIGN }}
        run: python code/tradingview_data/fx31_coverage_test.py
      - name: Metals universe
        env:
          SESSIONID: ${{ secrets.SESSIONID }}
          SESSIONID_SIGN: ${{ secrets.SESSIONID_SIGN }}
        run: python code/tradingview_data/metals_coverage_test.py
      - name: History depth
        env:
          SESSIONID: ${{ secrets.SESSIONID }}
          SESSIONID_SIGN: ${{ secrets.SESSIONID_SIGN }}
        run: python code/tradingview_data/history_depth_test.py
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradingview-coverage
          path: |
            artifacts/tradingview_fx31/
            artifacts/tradingview_metals/
            artifacts/tradingview_depth/
          retention-days: 7
