name: Metals Frozen Live Signal Diagnostic
on:
  workflow_dispatch:
  push:
    branches: [production/three-portfolio-integration]
    paths:
      - '.github/workflows/metals-live-signal.yml'
      - 'code/production/src/trading_prod/metals_frozen_signal_core.py'
      - 'code/production/tools/metals_live_signal_adapter.py'
      - 'code/production/config/metals_live_input_hash_fixture.json'
      - 'code/production/tests/test_metals_live_adapter.py'
permissions:
  contents: read
jobs:
  saved-pine-to-frozen-targets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing production and TradingView dependencies
        working-directory: code/production
        run: |
          python -m pip install --disable-pip-version-check -e '.[equity]'
          python -m pip install --disable-pip-version-check tradingview-api-python
      - name: Run full branch regression suite
        working-directory: code/production
        run: python -m unittest discover -s tests -v
      - name: Exact saved-Pine weekly inputs to frozen metals research targets
        working-directory: code/production
        env:
          SESSIONID: ${{ secrets.SESSIONID }}
          SESSIONID_SIGN: ${{ secrets.SESSIONID_SIGN }}
        run: python tools/metals_live_signal_adapter.py --out "$RUNNER_TEMP/metals_live_derived.json"
      - name: Preserve derived-only diagnostic (no raw TradingView inputs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metals-derived-research-targets
          path: ${{ runner.temp }}/metals_live_derived.json
          retention-days: 2
          if-no-files-found: ignore
