name: FAST Event-Time Capture Research
on:
  workflow_dispatch:
  push:
    branches: [production/fx-fast-api-input-gate]
    paths:
      - '.github/workflows/fast-event-time-capture.yml'
      - 'code/tradingview_data/fast_event_time_ledger.py'
      - 'code/tradingview_data/test_event_time_ledger.py'
      - 'code/tradingview_data/capture_fast_source_snapshot.py'
permissions:
  contents: read
jobs:
  read-only-event-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only TradingView client
        run: python -m pip install --disable-pip-version-check tradingview-api-python
      - name: Verify fail-closed snapshot and publication rules
        run: python -m unittest discover -v -s code/tradingview_data -p test_event_time_ledger.py
      - name: Capture all frozen source versions before shadow selection
        env:
          SESSIONID: ${{ secrets.SESSIONID }}
          SESSIONID_SIGN: ${{ secrets.SESSIONID_SIGN }}
        run: python code/tradingview_data/capture_fast_source_snapshot.py
      - name: Retain source-version DB and safe diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-fast-event-time-snapshot
          path: artifacts/fast_event_time_capture/
          retention-days: 30
          if-no-files-found: warn
